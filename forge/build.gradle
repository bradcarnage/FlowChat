plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = '2.1.2'
group = 'computer.brads.flowchat'

base {
    archivesName = 'flowchat-forge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

minecraft {
    mappings channel: 'official', version: '1.21.4'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.4-54.1.16'
    implementation 'com.google.code.gson:gson:2.11.0'
}

// Include common source directly
sourceSets {
    main {
        java {
            srcDir '../common/src/main/java'
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version)
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'FlowChat',
            'Specification-Version' : project.version,
            'Implementation-Title'  : 'FlowChat',
            'Implementation-Version': project.version,
        ])
    }
    finalizedBy 'reobfJar'
}

// ForgeGradle reobfuscation
reobf {
    jar {}
}
