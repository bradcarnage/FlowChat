name: FlowChat CI

on:
  push:
    branches:
      - 'multiplatform/**'
  schedule:
    # Nightly at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # ── Push: fast unit tests on the pushed branch ──
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: bare-metal
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk use java 17.0.15-tem
          java -version
          ./gradlew :common:test --no-daemon
        env:
          JAVA_HOME: /home/agent/.sdkman/candidates/java/17.0.15-tem

      - name: Test summary
        if: always()
        run: |
          echo "=== Test Results ==="
          find common/build/reports/tests/test -name '*.xml' -exec grep -l 'failures' {} \; 2>/dev/null || true
          grep -r 'tests="' common/build/test-results/test/*.xml 2>/dev/null | head -20 || true

  # ── Nightly: full build matrix across representative MC versions ──
  nightly-matrix:
    if: github.event_name == 'schedule'
    runs-on: bare-metal
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # JDK 8: oldest supported
          - branch: multiplatform/1.12.2
            java: 8.0.452-tem
          # JDK 11: 1.16.x era
          - branch: multiplatform/1.16.5
            java: 11.0.27-tem
          # JDK 17: 1.18-1.20.4 (current main)
          - branch: multiplatform/1.20.4
            java: 17.0.15-tem
          # JDK 21: latest MC versions
          - branch: multiplatform/1.21.5
            java: 21.0.7-tem
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Unit tests
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk use java ${{ matrix.java }}
          java -version
          ./gradlew :common:test --no-daemon
        env:
          JAVA_HOME: /home/agent/.sdkman/candidates/java/${{ matrix.java }}

      - name: Full build
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk use java ${{ matrix.java }}
          ./gradlew build --no-daemon
        env:
          JAVA_HOME: /home/agent/.sdkman/candidates/java/${{ matrix.java }}

      - name: Build summary
        if: always()
        run: |
          echo "=== ${{ matrix.branch }} (JDK ${{ matrix.java }}) ==="
          grep -r 'tests="' common/build/test-results/test/*.xml 2>/dev/null | head -10 || echo "No test results found"
          ls -la */build/libs/*.jar 2>/dev/null || echo "No JARs built"
