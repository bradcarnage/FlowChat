plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

base {
    archivesName = 'flowchat-velocity'
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    implementation project(':common')
    implementation project(':packetevents-common')
    compileOnly "com.velocitypowered:velocity-api:${rootProject.velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${rootProject.velocity_api_version}"
    compileOnly "com.github.retrooper:packetevents-velocity:${rootProject.packetevents_version}"
    // Adventure API provided by Velocity at runtime
    compileOnly "net.kyori:adventure-api:${rootProject.adventure_version}"
    // Serializers — shade without transitive adventure-api
    implementation("net.kyori:adventure-text-serializer-plain:${rootProject.adventure_version}") {
        exclude group: 'net.kyori', module: 'adventure-api'
    }
    implementation("net.kyori:adventure-text-serializer-gson:${rootProject.adventure_version}") {
        exclude group: 'net.kyori', module: 'adventure-api'
        exclude group: 'net.kyori', module: 'adventure-nbt'
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'computer.brads.flowchat.core', 'computer.brads.flowchat.velocity.libs.core'
    relocate 'computer.brads.flowchat.packet', 'computer.brads.flowchat.velocity.libs.packet'
    minimize()
}

tasks.assemble.dependsOn tasks.shadowJar
