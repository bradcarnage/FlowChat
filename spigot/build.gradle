plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

base {
    archivesName = 'flowchat-spigot'
}

dependencies {
    implementation project(':common')
    implementation project(':packetevents-common')
    compileOnly "org.spigotmc:spigot-api:${rootProject.spigot_api_version}"
    compileOnly "com.github.retrooper:packetevents-spigot:${rootProject.packetevents_version}"
    // Adventure API provided by Paper/PacketEvents at runtime
    compileOnly "net.kyori:adventure-api:${rootProject.adventure_version}"
    // Serializers — shade without transitive adventure-api
    implementation("net.kyori:adventure-text-serializer-plain:${rootProject.adventure_version}") {
        exclude group: 'net.kyori', module: 'adventure-api'
    }
    implementation("net.kyori:adventure-text-serializer-gson:${rootProject.adventure_version}") {
        exclude group: 'net.kyori', module: 'adventure-api'
        exclude group: 'net.kyori', module: 'adventure-nbt'
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'computer.brads.flowchat.core', 'computer.brads.flowchat.spigot.libs.core'
    relocate 'computer.brads.flowchat.packet', 'computer.brads.flowchat.spigot.libs.packet'
    minimize()
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: rootProject.version)
    }
}

tasks.assemble.dependsOn tasks.shadowJar
