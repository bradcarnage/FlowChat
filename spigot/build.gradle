plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.11'
}

base {
    archivesName = 'flowchat-spigot'
}

// Target Java 8 bytecode for legacy MC server compatibility (1.8.8+)
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}
// Disable JVM version variant matching so we can depend on :common (release=17 variant)
configurations.matching { it.canBeResolved }.configureEach {
    attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
    }
}

dependencies {
    implementation project(':common')
    implementation project(':packetevents-common')
    compileOnly "org.spigotmc:spigot-api:${rootProject.spigot_api_version}"
    compileOnly "com.github.retrooper:packetevents-spigot:${rootProject.packetevents_version}"
    compileOnly "net.kyori:adventure-api:${rootProject.adventure_version}"
}

shadowJar {
    archiveClassifier.set('')
    relocate 'computer.brads.flowchat.core', 'computer.brads.flowchat.spigot.libs.core'
    relocate 'computer.brads.flowchat.packet', 'computer.brads.flowchat.spigot.libs.packet'
    relocate 'com.google.gson', 'computer.brads.flowchat.spigot.libs.gson'
    minimize()
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: rootProject.version)
    }
}

tasks.assemble.dependsOn tasks.shadowJar
