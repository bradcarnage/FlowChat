name: Bug Report
description: Report a bug with FlowChat
labels: ["bug"]
body:
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft Version
      description: Which MC version are you running?
      options:
        - "1.21.11"
        - "1.21.9"
        - "1.21.5"
        - "1.21.4"
        - "1.21.1"
        - "1.20.6"
        - "1.20.4"
        - "1.20.1"
        - "1.19.4"
        - "1.19.2"
        - "1.18.2"
        - "1.17.1"
        - "1.16.5"
        - "1.16.1"
        - "1.15.2"
        - "1.14.4"
        - "1.12.2"
        - "1.11.2"
        - "1.10.2"
        - "1.9.4"
        - "1.8.9"
        - "1.7.10"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Fabric
        - Forge
        - NeoForge
        - Spigot
        - BungeeCord
        - Velocity
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Add this rule to flowchat.json...
        2. Join a server...
        3. Send a message...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste any relevant log output here
      render: shell

  - type: textarea
    id: config
    attributes:
      label: FlowChat Config
      description: Paste your flowchat.json (or the relevant rules)
      render: json
